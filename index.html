<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오차 범위 밖의 비가</title>
  <style>
    :root {
      --bg: #f5f5f3;
      --paper: #fcfcfa;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --font-serif: "Noto Serif KR", "Batang", "AppleMyungjo", Georgia, serif;
      --font-sans: "Noto Sans KR", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 54px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .book-header-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }

    .progress-bar-track {
      position: sticky;
      top: 54px;
      z-index: 25;
      height: 3px;
      background: #e5e7eb;
      width: 100%;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .workspace {
      display: flex;
      flex: 1;
      position: relative;
    }

    .toc-drawer {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      height: calc(100vh - 57px);
      position: sticky;
      top: 57px;
      overflow-y: auto;
      padding: 14px 10px 28px;
      transition: margin-left 0.2s ease;
    }
    .toc-drawer.collapsed {
      display: none;
    }

    .toc-heading {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 10px 10px;
      letter-spacing: 0.04em;
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .toc-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 2px;
    }
    .toc-item:hover { background: #f3f4f6; }
    .toc-item.is-part {
      font-weight: 700;
      color: #111827;
      margin-top: 8px;
    }
    .toc-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .reader-main {
      flex: 1;
      padding: 24px 16px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }

    .paper-card {
      width: 100%;
      max-width: 680px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(20px, 4vw, 36px) clamp(18px, 4vw, 38px) 40px;
      box-shadow: 0 2px 10px rgba(17, 24, 39, 0.04);
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.82;
      word-break: normal;
      overflow-wrap: break-word;
      min-width: 0;
    }

    .paper-card.sans-mode {
      font-family: var(--font-sans);
    }

    .cover-wrap {
      text-align: center;
    }
    .cover-img {
      max-width: 100%;
      max-height: 76vh;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }

    .part-wrap {
      text-align: center;
      padding: 80px 12px;
    }
    .part-label {
      font-size: 0.95em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .part-title {
      font-size: 1.65em;
      font-weight: 700;
      margin: 0;
      color: #111827;
    }

    .chap-title {
      font-size: 1.38em;
      font-weight: 700;
      color: #111827;
      margin: 0 0 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    p.body-p {
      margin: 0 0 0.75em;
      text-indent: 1em;
      text-align: left;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .paper-card img {
      max-width: 100%;
      height: auto;
    }

    .illus-wrap {
      margin: 22px auto;
      text-align: center;
    }
    .illus-img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }

    .math-block {
      margin: 18px auto;
      padding: 10px 14px;
      background: #f3f4f6;
      border-radius: 6px;
      text-align: center;
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
      font-size: 0.95em;
      text-indent: 0;
      overflow-x: auto;
      max-width: 100%;
    }
    .inline-math {
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
    }

    .ai-notice {
      margin-top: 28px;
      padding: 12px 14px;
      background: #f3f4f6;
      border-left: 3px solid #9ca3af;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.6;
      color: #4b5563;
    }

    .chapter-nav {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 10px;
    }
    .page-status {
      font-size: 13px;
      color: var(--muted);
    }

    .settings-popover {
      position: fixed;
      top: 62px;
      right: 14px;
      z-index: 40;
      width: 248px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 14px;
      display: none;
    }
    .settings-popover.open { display: block; }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-group {
      display: flex;
      gap: 4px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 50;
      display: none;
    }
    .toast.show { display: block; }

    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(37, 99, 235, 0.12);
      border: 3px dashed var(--accent);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .drop-overlay.active { display: flex; }

    #printContainer {
      display: none;
    }

    @media print {
      @page {
        size: A5;
        margin: 16mm 14mm 18mm;
      }
      .app-shell, .settings-popover, .toast, .drop-overlay {
        display: none !important;
      }
      #printContainer {
        display: block !important;
        font-family: var(--font-serif);
        font-size: 10.5pt;
        line-height: 1.65;
        color: #111827;
      }
      #printContainer .print-section {
        page-break-before: always;
        break-before: page;
      }
      #printContainer .print-section:first-child {
        page-break-before: auto;
        break-before: auto;
      }
      #printContainer img {
        max-width: 100%;
        max-height: 140mm;
        height: auto;
        display: block;
        margin: 8pt auto;
      }
      #printContainer .cover-img {
        max-height: 175mm;
      }
      #printContainer p.body-p {
        text-align: justify;
        text-indent: 1em;
        margin: 0 0 4.5pt 0;
      }
    }

    @media (max-width: 1080px) {
      .toc-drawer {
        position: fixed;
        top: 57px;
        left: 0;
        z-index: 35;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.08);
      }
    }
  </style>
</head>

          <span id="pageStatus" class="page-status">1 / 1</span>
          <button id="nextChapBtn" class="btn" type="button">다음 장</button>
        </div>
      </main>
    </div>
  </div>

  <div id="printContainer"></div>
